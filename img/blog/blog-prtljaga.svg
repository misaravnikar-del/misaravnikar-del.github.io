<!-- Bookiraj.si — naslovnica za objavo »Karta za 30 € ni 30 €«.
     Narisana, ne fotografija: prikazuje tri vrste prtljage v pravem razmerju velikosti,
     kar je tudi bistvo objave. Barve so iz palete strani. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="oz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6EDF2"/>
      <stop offset="1" stop-color="#D5DFE6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#oz)"/>

  <!-- osebna torba: 40×20×25 cm -->
  <g transform="translate(210 430)">
    <rect x="-70" y="-120" width="140" height="120" rx="14" fill="#FFFFFF" stroke="#0C7F93" stroke-width="5"/>
    <path d="M-30 -120 v-16 a30 30 0 0 1 60 0 v16" fill="none" stroke="#0C7F93" stroke-width="5" stroke-linecap="round"/>
    <rect x="-70" y="-72" width="140" height="7" fill="#0C7F93" opacity=".22"/>
    <text x="0" y="46" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#101920">osebna torba</text>
    <text x="0" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#697176">vključena</text>
  </g>

  <!-- ročna prtljaga: 55×40×20 cm -->
  <g transform="translate(600 430)">
    <rect x="-95" y="-215" width="190" height="215" rx="18" fill="#FFFFFF" stroke="#0C7F93" stroke-width="5"/>
    <path d="M-34 -215 v-30 h68 v30" fill="none" stroke="#0C7F93" stroke-width="5" stroke-linecap="round"/>
    <rect x="-95" y="-150" width="190" height="8" fill="#0C7F93" opacity=".22"/>
    <circle cx="-52" cy="12" r="13" fill="#101920" opacity=".28"/>
    <circle cx="52" cy="12" r="13" fill="#101920" opacity=".28"/>
    <text x="0" y="66" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#101920">ročna prtljaga</text>
    <text x="0" y="102" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#B8452C">doplačilo</text>
  </g>

  <!-- oddana prtljaga: 20 kg -->
  <g transform="translate(1000 430)">
    <rect x="-120" y="-290" width="240" height="290" rx="22" fill="#FFFFFF" stroke="#0C7F93" stroke-width="5"/>
    <path d="M-42 -290 v-34 h84 v34" fill="none" stroke="#0C7F93" stroke-width="5" stroke-linecap="round"/>
    <rect x="-120" y="-206" width="240" height="9" fill="#0C7F93" opacity=".22"/>
    <circle cx="-66" cy="16" r="16" fill="#101920" opacity=".28"/>
    <circle cx="66" cy="16" r="16" fill="#101920" opacity=".28"/>
    <text x="0" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#101920">oddana prtljaga</text>
    <text x="0" y="108" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#B8452C">doplačilo</text>
  </g>

  <text x="80" y="110" font-family="Georgia,serif" font-size="58" fill="#101920">Karta za 30 € ni 30 €</text>
  <text x="80" y="156" font-family="Georgia,serif" font-size="30" fill="#697176">Velikosti so v razmerju — toliko res smeš vzeti s seboj.</text>
</svg>
